name: animated_stack_plus
description: >
  A customizable and responsive animated stack widget inspired by the original `animated_stack` package. 
  Supports expandable FAB with top/bottom content, auto-dismiss, and smooth animations for web and mobile.

version: 1.0.0

homepage: https://github.com/your-username/animated_stack_plus
repository: https://github.com/your-username/animated_stack_plus
issue_tracker: https://github.com/your-username/animated_stack_plus/issues

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Optional but recommended
topics:
  - animation
  - fab
  - floatingactionbutton
  - animatedfab
  - animatedstack

flutter:
  uses-material-design: true
