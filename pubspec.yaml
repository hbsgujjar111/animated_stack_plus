name: animated_stack_plus
description: A flexible and modern animated Floating Action Button (FAB) stack for Flutter with custom icons, builders, and smooth animations.
version: 1.2.0
homepage: https://github.com/hbsgujjar111/animated_stack_plus
repository: https://github.com/hbsgujjar111/animated_stack_plus
issue_tracker: https://github.com/hbsgujjar111/animated_stack_plus/issues
topics:
  - fab
  - floating-action-button
  - animation
  - menu
  - ui

screenshots:
  - description: 'Mobile demo: tapping the FAB slides the screen away to reveal the action stack.'
    path: example/mobile-example.gif
  - description: 'Web demo of the same animated FAB stack.'
    path: example/web-example.gif

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
